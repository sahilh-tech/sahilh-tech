name: Update combined contributions

on:
  schedule:
    - cron: '17 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: combined-contributions-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Run generator tests
        run: node --test
      - name: Generate combined contribution assets
        run: node scripts/update-contributions.mjs
        env:
          CONTRIB_TOKEN_LAB: ${{ secrets.CONTRIB_TOKEN_LAB }}
          CONTRIB_TOKEN_TECH: ${{ secrets.CONTRIB_TOKEN_TECH }}
          CONTRIB_TOKEN_AROBOTIX: ${{ secrets.CONTRIB_TOKEN_AROBOTIX }}
          CONTRIB_TOKEN_ACTIFIED: ${{ secrets.CONTRIB_TOKEN_ACTIFIED }}
          CONTRIB_TOKEN_MODAIS: ${{ secrets.CONTRIB_TOKEN_MODAIS }}
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.json assets/contributions.svg assets/contributions-mobile.svg
          if git diff --cached --quiet; then
            echo "Contribution assets are unchanged."
            exit 0
          fi
          git commit -m "chore: update combined contribution graph"
          git push origin HEAD:main
